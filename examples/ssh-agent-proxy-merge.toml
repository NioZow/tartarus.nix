# Merge several agents into one local socket: a proxy server whose transport is
# a local unix socket and whose rule allows everything (no identity, no dialog).
#
# This replaces the former `--merge` mode. It is an ordinary `mode = "proxy"`
# server: one `unix` listener plus a wildcard `rule` that allows all keys. The
# server owns the upstream agent sockets and forwards their identities.
mode = "proxy"

# Upstream agents to fan in. No key/rule needs to pre-list them: sockets named
# here are probed and their identities admitted opportunistically.
agent_sockets = ["%t/ssh-agent", "%t/gnupg/S.gpg-agent.ssh"]

# Allow all keys, for auth and data signing, without a prompt.
[[rule]]
key = "*"
auth = "allow"
data_signing = "allow"
notify = false

[[listeners]]
type = "unix"
socket = "%t/ssh-agent-merged"
resolution = "none"

[listeners.security]
transport_encryption = "none"   # local socket, same uid -> identity is unset
client_auth = "none"
server_auth = "none"

# Then point clients at it:
#
#   export SSH_AUTH_SOCK="${XDG_RUNTIME_DIR}/ssh-agent-merged"
#
# To pick up per-session `ssh -R` forwarded sockets that appear and disappear,
# add `scan_agent_socket_dirs = true` to the `[[listeners]]` entry and list the
# directory holding them in `agent_sockets`.
