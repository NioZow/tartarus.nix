# sudo-auth-proxy — standalone server configuration (no Nix required)
#
# This is the *host* side of the service: the process that shows the
# privilege-elevation dialog on the machine where the human sits. It is the
# counterpart of the PAM client that runs inside the guest (see
# `tartarus.sudo-auth-proxy` in the NixOS/home-manager modules, and the MOFOS
# guest at `hosts/nixos/mofos/default.nix`).
#
# It is deliberately written as a plain TOML file so it can run on a machine
# with no Nix at all — any Linux distribution with Python 3.11+ and the
# `cryptography` wheel. The full design and threat model live in
# `docs/technical/sudo-auth-proxy.md`; §15.1 has the step-by-step setup.
#
# Copy it to `~/.config/sudo-auth-proxy/config.toml` and run:
#
#   sudo-auth-proxy --config ~/.config/sudo-auth-proxy/config.toml
#
# This is the **flat** (single-transport) form: a top-level `transport` plus the
# `[security]`/`[mtls]` tables and the document-level `[[rule]]` list. The server
# still accepts it and treats the whole document as **one implicit listener**, so
# existing hand-written configs keep working. To bind several transports in one
# process (a `vsock` VM *and* a `tcp` container *and* an `ssh -R` forwarded
# `unix` socket), use the multi-listener form instead:
# `examples/sudo-auth-proxy-listeners.toml` — a `[listener_defaults]` table plus
# one `[[listeners]]` entry per listener. This file and that one are the same
# server, one listener versus many.
#
# Paths inside this file are resolved relative to the file's own directory, so
# `./ca.crt` means "next to this config".
#
# ---------------------------------------------------------------------------
# Read this before editing: the file is validated against an EXACT schema
#
# At startup every key, at every level, is checked against the set the service
# actually reads. A typo (`max_connection`) and a key on the wrong side of a
# `[table]` header are both refused, with the offending key named -- nothing is
# silently ignored. An ignored knob is worse than a missing one, because the
# operator believes it is in force.
#
# The trap this schema exists for is a *placement* error. TOML assigns a key to
# the **nearest preceding `[table]` header**, so the three authentication knobs
# must sit *under* `[security]`: written above it they are top-level keys, the
# service sees no `[security]` values at all, and it exits with
#
#   sudo-auth-proxy: 'client_auth' must be written in [security], but it is
#   written at the top level
#
# ...which is exactly as fatal as leaving them out, because with
# `transport_encryption = "none"` the service refuses to run rather than
# disable authentication implicitly (doc §7.5). Everything above the first
# table header must stay above it; every key below a header belongs to that
# header's table until the next one.
#
# Accepted top-level keys: mode, transport, cid, host, port, socket,
# socket_dir_mode, socket_mode, connect_timeout, decision_timeout, recv_timeout,
# max_connections, server_read_timeout, dialog_program, resolution, debug,
# approver, client_version, guest_hint -- plus the `[security]`/`[mtls]` tables,
# the `[labels]` map and the `[[rule]]` list. There is no `[acl]` on the server
# (the client `[acl]` pins the trusted server instead). The full key list is doc
# §7.9; the `[security]` keys are spelled out below.
# `tests/test_sudo_auth_proxy.py`
# (`test_shipped_example_config_matches_the_schema`) validates this file, so it
# cannot drift out of the schema unnoticed.

# ---------------------------------------------------------------------------
# mode = "server" | "client"
#
# Required, and deliberately not defaulted: a config that forgets it must not
# silently start a listener.
# ---------------------------------------------------------------------------
mode = "server"

# ---------------------------------------------------------------------------
# Transport: how the guest reaches this server.
#
#   "vsock"  the guest dials the host over AF_VSOCK (no IP stack, no firewall
#            port, point-to-point between the VM and its hypervisor)
#   "tcp"    the guest dials an address:port
#   "unix"   the host dials into the guest over SSH and forwards a Unix socket
#            (`ssh -R`); needs no address on the guest side, but only exists
#            while the SSH session is up
#
# This example is the VSOCK callback used by the MOFOS guest.
# ---------------------------------------------------------------------------
transport = "vsock"

# The VSOCK CID to bind. `2` is VMADDR_CID_HOST — the hypervisor, from the
# guest's point of view — and is what the tartarus host module binds. Use `-1`
# (VMADDR_CID_ANY) to accept on every local CID instead.
cid = 2

# Both sides must agree on the port. The MOFOS guest is configured with 65012;
# the tartarus-internal guests use 65001.
port = 65012

# ---------------------------------------------------------------------------
# Timeouts (seconds unless noted)
# ---------------------------------------------------------------------------

# Bound on the client's connect + TLS handshake. Must be small: this process
# backs a PAM hook that runs on *every* `sudo`, and an unreachable peer must
# not stall the stack.
connect_timeout = 0.2

# The human window. `0` waits indefinitely; `120` is the shipped default.
decision_timeout = 120

# Bound on the first frame after the connection (the pre-dialog
# `auth_pending` acknowledgement), so a stale/half-open peer fails fast
# without bounding the human's time to answer.
recv_timeout = 0.5

# Pre-authentication resource bounds: at most this many handler threads run at
# once, and an accepted connection may stall at most this long (this bounds a
# TCP connect that never finishes its TLS handshake) before it is dropped.
max_connections = 64
server_read_timeout = 10.0

# ---------------------------------------------------------------------------
# The dialog backend. One of "zenity" (Linux), "osascript"/"swiftdialog" (macOS).
#
# It is never auto-detected: a wrong guess would either fail every prompt or,
# worse, show a dialog on the wrong session. The prompt is a two-line summary on
# every backend; the full detail block (identity, TTY, CWD, request id) sits
# behind a "Details" affordance: an info button on swiftDialog, a third button on
# osascript, and zenity's `--extra-button` -- offered only when the installed
# zenity advertises it, which is probed once per process. "Details" is never a
# decision on any backend; it opens a second dialog and only an explicit
# "Authorize" there allows. `debug = true` below still logs the whole block.
# ---------------------------------------------------------------------------
dialog_program = "zenity"

# `socket` is the single Unix socket for the `unix` transport (`%t` = the
# per-user runtime directory). Unused for `vsock`/`tcp`, but harmless — and it
# is where a `unix`-transport server would listen. It must be written BEFORE
# the `[security]`/`[mtls]` tables below: in TOML, every key after a table
# header belongs to that table.
socket = "%t/sudo-auth-proxy/server.sock"
socket_dir_mode = "0700"
socket_mode = "0600"

# Log connection/handshake/request timing and the sanitised request fields to
# stderr. The full detail block (the one the dialog summarises) is logged here
# too, which is how you inspect a request on a backend with no "Details"
# affordance.
debug = false

# How to resolve the connecting client's friendly name shown in the dialog:
#
#   "none"         show the transport's raw label (address/CID)
#   "certificate"  verified peer certificate CN (mTLS only)
#   "tartarus"     the local VM bookkeeping state directory
#   "mofos"        `mofos ls --json`, matching the peer's VSOCK CID or
#                  `ipv4_address` to a VM name
#
# The resolved name is also what a `[[rule]]` `match.machine` selector matches.
# For the MOFOS guest callback this example resolves the VM name via `mofos`.
resolution = "mofos"

# ---------------------------------------------------------------------------
# [security] — the three authentication knobs.
#
# mTLS is the ONLY authentication mechanism this service has. There is no
# message signing, no SSH-key signature, and no application-layer certificate
# signature: either the TLS channel authenticates both peers
# (`transport_encryption = "mtls"`, which forces both auths to "transport"),
# or authentication is explicitly switched off on all three knobs.
#
# Never leave a knob out: with `transport_encryption = "none"` the service
# refuses to start unless `client_auth` and `server_auth` are both written as
# "none". Disabling authentication is a decision, not a default.
# ---------------------------------------------------------------------------
[security]
# "none" | "mtls". A VSOCK connection is point-to-point between the guest and
# its hypervisor, with no network path for a third party, so this example
# leaves it unencrypted. Use "mtls" for anything that crosses a network you do
# not control, and see docs/technical/sudo-auth-proxy.md §7 for the `[mtls]` block.
transport_encryption = "none"

# "transport" | "none". Does not authenticate the requester: any process inside
# the guest that can reach CID 2 port 65012 can raise a prompt here.
client_auth = "none"

# "transport" | "none". Nothing authenticates the response, so a compromised
# guest could feed itself an `allow`. Acceptable only because the guest is the
# machine being *granted* privilege, and the guest cannot reach this server
# except over the private VSOCK link.
server_auth = "none"

# Seconds a response stays valid (`issued_at` .. `expires_at`) and the clock
# skew tolerated when checking it. Only meaningful with mTLS, but harmless.
response_ttl = 30
clock_skew = 5

# ---------------------------------------------------------------------------
# [[rule]] — the approval policy. A single ordered, document-level list; there
# is no per-listener ACL and no separate authorization table. The mTLS
# transport authenticates the requester (when `client_auth = "transport"`), and
# the rules decide the outcome.
#
# **First match wins; there is no merging between rules.** A permissive rule
# written above a restrictive one therefore takes precedence: rule order is a
# security decision.
#
# Each rule has an optional `[rule.match]` table and an optional `policy`
# (`allow` = reply without a dialog, `deny` = reply without a dialog, `ask` =
# show the prompt; the default with no match is `ask`). Every selector is a glob
# (`fnmatch`) written as a bare string or a list of patterns; an empty/absent
# selector matches anything.
#
#   match.machine        resolved name / label / verified credential fingerprint
#   match.listeners      accepting listener name (empty matches any)
#   match.target_user    target (PAM) user
#   match.invoking_user  invoking user
#   match.service        PAM service (sudo/su/login)
#
# `target_user`/`invoking_user`/`service` are self-reported by the guest, so
# they refine the decision but can never authorize a request the transport did
# not authenticate. Uncomment to auto-allow a known VM and prompt otherwise:
#
#   [[rule]]
#   match.machine = "template-nixos"
#   match.target_user = "root"
#   match.service = "sudo"
#   policy = "allow"
#
#   [[rule]]
#   policy = "ask"
