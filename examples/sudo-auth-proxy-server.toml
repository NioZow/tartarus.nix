# sudo-auth-proxy — standalone server configuration (no Nix required)
#
# This is the *host* side of the service: the process that shows the
# privilege-elevation dialog on the machine where the human sits. It is the
# counterpart of the PAM client that runs inside the guest (see
# `tartarus.sudo-auth-proxy` in the NixOS/home-manager modules, and the MOFOS
# guest at `hosts/nixos/mofos/default.nix`).
#
# It is deliberately a plain TOML file so it can run on a machine with no Nix at
# all — any Linux distribution with Python 3.11+ and the `cryptography` wheel.
# The full design and threat model live in `docs/technical/sudo-auth-proxy.md`;
# §15.1 has the step-by-step setup.
#
# Copy it to `~/.config/sudo-auth-proxy/config.toml` and run:
#
#   sudo-auth-proxy --config ~/.config/sudo-auth-proxy/config.toml
#
# ONE server binds MANY listeners. A listener is one socket plus its transport,
# described by one `[[listeners]]` entry; the whole document — the dialog
# backend, the approval rules — is shared. This example binds three listeners in
# the one process:
#
#   * `vsock`  "vm-callback"   a Linux MicroVM dials the host callback endpoint;
#   * `tcp`    "tcp-callback"  a container / stand-in VM dials an address:port;
#   * `unix`   "remote-guest"  the host dials into a guest over SSH and forwards
#                              a Unix socket (`ssh -R`), authenticated with mTLS.
#
# Every `[[listeners]]` entry is **self-contained**: a field it omits simply
# falls back to the built-in default (documented per field below), so one entry
# can be retyped without a shared defaults block. The document-level `[[rule]]`
# list then scopes itself to a listener by name.
#
# Paths inside this file are resolved relative to the file's own directory, so
# `./ca.crt` means "next to this config"; `%t` expands to the per-user runtime
# directory.
#
# ---------------------------------------------------------------------------
# Read this before editing: the file is validated against an EXACT schema
#
# At startup every key, at every level, is checked against the set the service
# actually reads. A typo (`max_connection`) and a key on the wrong side of a
# `[table]` header are both refused, with the offending key named -- nothing is
# silently ignored. An ignored knob is worse than a missing one, because the
# operator believes it is in force.
#
# The trap this schema exists for is a *placement* error. TOML assigns a key to
# the **nearest preceding `[table]` header**, so a `[listeners.security]` block
# belongs to the listener declared just above it, and the three authentication
# knobs must sit *under* `[listeners.security]`: written above it they are
# top-level listener keys, the service sees no `[security]` values at all, and it
# exits with
#
#   sudo-auth-proxy: 'client_auth' must be written in [security], but it is
#   written at the top level
#
# ...which is exactly as fatal as leaving them out, because with
# `transport_encryption = "none"` the service refuses to run rather than disable
# authentication implicitly (§7.5). The `[listener_defaults]` block was removed:
# there is no shared default table any more, each entry carries its own values.
#
# Accepted document-level keys: mode, dialog_program, debug, approver,
# client_version, guest_hint, the `[[rule]]` list and the `[labels]` map. Every
# `[[listeners]]` key is `type`, `name`, `port`, `cid`, `host`, `socket`,
# `socket_dir_mode`, `socket_mode`, `connect_timeout`, `decision_timeout`,
# `recv_timeout`, `max_connections`, `server_read_timeout`, `resolution`, and
# the nested `[listeners.security]`/`[listeners.mtls]` tables. The full key list
# is doc §7.9. `tests/test_sudo_auth_proxy.py`
# (`test_shipped_multi_listener_example_parses`) loads this exact file, so it
# cannot drift out of the schema unnoticed.

# ---------------------------------------------------------------------------
# mode = "server" | "client"
#
# Required, and deliberately not defaulted: a config that forgets it must not
# silently start a listener.
# ---------------------------------------------------------------------------
mode = "server"

# The dialog backend. One of "zenity" (Linux), "osascript"/"swiftdialog" (macOS).
# It is never auto-detected: a wrong guess would either fail every prompt or,
# worse, show a dialog on the wrong session.
dialog_program = "zenity"

# Log connection/handshake/request timing and the sanitised request fields to
# stderr. The full detail block (the one the dialog summarises) is logged here
# too, which is how you inspect a request on a backend with no "Details"
# affordance.
debug = false

# ===========================================================================
# LISTENER 1 — the VSOCK callback, named "vm-callback".
#
# A Linux MicroVM dials the host over AF_VSOCK: a point-to-point link between
# the guest and its hypervisor with no network path for a third party, so this
# listener leaves authentication explicitly off. It shows every listener key
# written out; the two listeners below only show the keys that differ.
# ===========================================================================
[[listeners]]
# Required. The transport this listener binds: "vsock" | "tcp" | "unix".
type = "vsock"
# Optional label, unique across the server. `[[rule]] match.listeners` selects
# listeners by it; an unnamed listener matches only an empty/`*`-only selector.
name = "vm-callback"
# VSOCK CID to bind. `2` is VMADDR_CID_HOST (the hypervisor, from the guest's
# point of view); `-1` (VMADDR_CID_ANY) accepts on every local CID.
cid = 2
# Port the peer dials. Both sides must agree (the MOFOS guest uses 65012).
port = 65012

# How the connecting client's friendly name (shown in the dialog, matched by
# `rule.*.match.machine`) is resolved:
#   "none"         the transport's raw label (address/CID)
#   "certificate"  verified peer certificate CN/SAN (mTLS only)
#   "tartarus"     the local VM bookkeeping state directory
#   "mofos"        `mofos ls --json`, mapping the peer's CID or `ipv4_address`
resolution = "mofos"

# Timeouts and pre-auth resource bounds (seconds unless noted). `connect_timeout`
# must be small: this backs a PAM hook that runs on *every* `sudo`, and an
# unreachable peer must not stall the stack. `decision_timeout = 0` waits for the
# human indefinitely. `max_connections` caps the handler threads; an accepted
# connection may stall at most `server_read_timeout` before it is dropped.
connect_timeout = 0.2
decision_timeout = 120
recv_timeout = 0.5
max_connections = 64
server_read_timeout = 10.0

# [listeners.security] — the three authentication knobs for THIS listener.
# mTLS is the ONLY authentication mechanism: either the TLS channel
# authenticates both peers (`transport_encryption = "mtls"`, which forces both
# auths to "transport"), or authentication is explicitly switched off. With
# `transport_encryption = "none"` the service refuses to start unless
# `client_auth` and `server_auth` are both written as "none": disabling
# authentication is a decision, not a default.
[listeners.security]
transport_encryption = "none"
client_auth = "none"
server_auth = "none"

# ===========================================================================
# LISTENER 2 — the TCP callback, named "tcp-callback".
#
# A container or stand-in VM dials an address:port. `host` is the gateway
# address the guests reach; here it is the loopback. Like the VSOCK callback
# this listener runs unauthenticated (a private bridge), so it names only the
# keys that differ from the defaults.
# ===========================================================================
[[listeners]]
type = "tcp"
name = "tcp-callback"
host = "127.0.0.1"
port = 65001

[listeners.security]
transport_encryption = "none"
client_auth = "none"
server_auth = "none"

# ===========================================================================
# LISTENER 3 — the SSH-forwarded unix socket, named "remote-guest".
#
# The host dials into the guest over SSH and forwards a Unix socket (`ssh -R`),
# which this server binds. Unlike the callback listeners this one crosses a
# guest the host does not fully trust with the host keyring, so it uses mTLS:
# the TLS channel authenticates both peers and the certificate chain (against
# `[listeners.mtls] ca_file`) is what admits the guest.
# ===========================================================================
[[listeners]]
type = "unix"
name = "remote-guest"
socket = "%t/sudo-auth-proxy/server.sock"
socket_dir_mode = "0700"
socket_mode = "0600"
resolution = "certificate"

[listeners.security]
transport_encryption = "mtls"
client_auth = "transport"
server_auth = "transport"

# [listeners.mtls] — required when transport_encryption = "mtls". `./ca.crt`,
# `./server.crt` and `./server.key` are the host's X.509 material; the EKU OIDs
# separate the two roles (see the standalone setup in doc §15.1).
[listeners.mtls]
enable = true
ca_file = "./ca.crt"
cert_file = "./server.crt"
key_file = "./server.key"
required_oid = "1.3.6.1.4.1.99999.1.1"      # this (server) certificate
peer_required_oid = "1.3.6.1.4.1.99999.1.2" # the peer (client) certificate

# ===========================================================================
# [[rule]] — the approval policy. A single ordered, document-level list; there
# is no per-listener ACL and no separate authorization table. The mTLS transport
# authenticates the requester (when `client_auth = "transport"`), and the rules
# decide the outcome.
#
# **First match wins; there is no merging between rules.** A permissive rule
# written above a restrictive one therefore takes precedence: rule order is a
# security decision. No rule matching means `ask`.
#
# Each rule has an optional `[rule.match]` table and a `policy` (`allow` = reply
# without a dialog, `deny` = reply without a dialog, `ask` = show the prompt).
# Every selector is a glob (`fnmatch`) written as a bare string or a list of
# patterns; an empty/absent selector matches anything.
#
#   match.machine        resolved name / label / verified credential fingerprint
#   match.listeners      accepting listener name (empty matches any)
#   match.target_user    target (PAM) user
#   match.invoking_user  invoking user
#   match.service        PAM service (sudo/su/login)
#
# `target_user`/`invoking_user`/`service` are self-reported by the guest, so
# they refine the decision but can never authorize a request the transport did
# not authenticate.
# ===========================================================================

# The SSH-forwarded remote guest: prompt before every elevation. Only this named
# listener is affected; the unnamed-but-listed callbacks are covered by the
# catch-all below.
[[rule]]
match.listeners = ["remote-guest"]
policy = "ask"

# Uncomment to auto-allow a known VM (matched by its resolved name) and prompt
# otherwise. Keep it above the catch-all: the first match wins.
# [[rule]]
# match.machine = "template-nixos"
# match.target_user = "root"
# match.service = "sudo"
# policy = "allow"

# Everything else: prompt. (`allow`/`deny` answer without a dialog.)
[[rule]]
policy = "ask"
