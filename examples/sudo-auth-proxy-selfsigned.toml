# sudo-auth-proxy — standalone NO-CA server example (self-signed pinning)
#
# This is the CA-free counterpart of `sudo-auth-proxy-server.toml`. Each side
# mints a self-signed leaf certificate and whitelists the peer's certificate;
# there is no CA and no CA key. The trust anchor is the client certificate
# itself, so `ca_file` below points at `zeus.crt`, not at a CA.
#
# Generate the material (no CA is created):
#
#   # on the server host (athena)
#   tartarus-certs selfsigned --role server --cn athena \
#     --service sudo-auth-proxy \
#     --key ~/.config/sudo-auth-proxy/server.key \
#     --cert ~/.config/sudo-auth-proxy/server.crt \
#     --pub ~/.config/sudo-auth-proxy/server.pub
#
#   # on the client host (zeus), then copy zeus.crt to the server
#   tartarus-certs selfsigned --role client --cn zeus \
#     --service sudo-auth-proxy \
#     --key /etc/sudo-auth-proxy/client.key \
#     --cert /etc/sudo-auth-proxy/client.crt \
#     --pub /etc/sudo-auth-proxy/client.pub
#
# The equivalent Nix options are:
#
#   pubkey = {
#     certFile = ./server.crt;
#     keyFile = "/etc/sudo-auth-proxy/server.key";
#     trustedPeerCerts = [ ./zeus.crt ];
#   };
#
# or, on the client:
#
#   pubkey = {
#     certFile = ./client.crt;
#     keyFile = "/etc/sudo-auth-proxy/client.key";
#     trustedPeerCerts = [ ./athena.crt ];
#   };
#
# The certificates MUST carry the standard EKU plus the service OID
# (serverAuth + …1.1 for the server, clientAuth + …1.2 for the client); the
# `selfsigned` command always adds both. Without the standard EKU the handshake
# fails with "unsuitable certificate purpose". See doc §7.8a.

mode = "server"
dialog_program = "zenity"
debug = false

[[listeners]]
type = "unix"
name = "remote-guest"
socket = "%t/sudo-auth-proxy/server.sock"
socket_dir_mode = "0700"
socket_mode = "0600"
resolution = "certificate"

[listeners.security]
transport_encryption = "mtls"
client_auth = "transport"
server_auth = "transport"

[listeners.mtls]
enable = true
# The NO-CA bit: the client's self-signed certificate is the trust anchor.
ca_file = "./zeus.crt"
cert_file = "./server.crt"
key_file = "./server.key"
required_oid = "1.3.6.1.4.1.99999.1.1"      # this (server) certificate
peer_required_oid = "1.3.6.1.4.1.99999.1.2" # the peer (client) certificate

[[rule]]
match.listeners = ["remote-guest"]
policy = "ask"

[[rule]]
policy = "ask"
