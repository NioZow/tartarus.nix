# sudo-auth-proxy — multi-listener server configuration (no Nix required)
#
# This is the *multi-transport* sibling of `examples/sudo-auth-proxy-server.toml`.
# Where that file binds exactly one transport (it is the legacy flat form, still
# accepted as a single implicit listener), this one binds **three listeners in
# the one server process**:
#
#   * `vsock`  the guest dials the host over AF_VSOCK (a Linux MicroVM);
#   * `tcp`    the guest dials an address:port (a container or a stand-in VM);
#   * `unix`   the host dials into the guest over SSH and forwards a Unix socket
#              (`ssh -R`), authenticated with mTLS.
#
# The document shape is a `[transport_defaults]` table — deep-merged into every
# listener by the server — followed by one `[[transports]]` entry per listener.
# An entry only has to write the fields it overrides; everything else comes from
# the defaults block. This is exactly what the tartarus host module emits for a
# host whose guests request more than one transport.
#
# Copy it to `~/.config/sudo-auth-proxy/config.toml` and run:
#
#   sudo-auth-proxy --config ~/.config/sudo-auth-proxy/config.toml
#
# Paths inside this file are resolved relative to the file's own directory, so
# `./ca.crt` means "next to this config"; `%t` expands to the per-user runtime
# directory. The single-listener form and its exact-schema rules are explained
# in `examples/sudo-auth-proxy-server.toml` (and doc §3/§7.9).

# ---------------------------------------------------------------------------
# The role and the dialog backend are document-level (shared by every listener).
# ---------------------------------------------------------------------------
mode = "server"
dialog_program = "zenity"

# ---------------------------------------------------------------------------
# [transport_defaults] — the value of every field for every listener. A listener
# entry that omits a field gets this one; an entry that sets it overrides just
# that field (the nested `[security]`/`[acl]`/`[mtls]` tables merge key by key).
#
# The callback listeners (`vsock`/`tcp`) are point-to-point or on a private
# bridge, so the defaults leave authentication explicitly off. Never leave the
# three `[security]` knobs out: with `transport_encryption = "none"` the service
# refuses to start unless `client_auth` and `server_auth` are both written.
# ---------------------------------------------------------------------------
[transport_defaults]
port = 65001
cid = 2
host = "127.0.0.1"
socket = "%t/sudo-auth-proxy/server.sock"
socket_dir_mode = "0700"
socket_mode = "0600"
connect_timeout = 0.2
decision_timeout = 120
recv_timeout = 0.5
max_connections = 64
server_read_timeout = 10.0
resolution = "none"

[transport_defaults.security]
transport_encryption = "none"
client_auth = "none"
server_auth = "none"

[transport_defaults.acl]
mode = "none"

# ---------------------------------------------------------------------------
# [[transports]] #1 — the VSOCK callback used by a Linux MicroVM.
#
# It overrides nothing: `type` is the only required key and `cid = 2`
# (VMADDR_CID_HOST) is the defaults' value. The listener inherits the
# unauthenticated `[security]`/`[acl]` above.
# ---------------------------------------------------------------------------
[[transports]]
type = "vsock"
cid = 2

# ---------------------------------------------------------------------------
# [[transports]] #2 — the TCP callback used by containers / stand-in VMs.
#
# The `host` it binds is the gateway address the guests dial; here it is the
# loopback. The security/ACL are written out explicitly for the reader even
# though they match the defaults.
# ---------------------------------------------------------------------------
[[transports]]
type = "tcp"
host = "127.0.0.1"
port = 65001

[transports.security]
transport_encryption = "none"
client_auth = "none"
server_auth = "none"

[transports.acl]
mode = "none"

# ---------------------------------------------------------------------------
# [[transports]] #3 — the SSH-forwarded Unix socket: the host dials into the
# guest over SSH and forwards a Unix socket (`ssh -R`), which this server binds.
#
# Unlike the callback listeners this one crosses a guest the host does not
# fully trust with the host keyring, so it uses mTLS: the TLS channel
# authenticates both peers and the ACL accepts any credential that chains to
# the tartarus CA and carries the client EKU OID. `./ca.crt`, `./server.crt`
# and `./server.key` are the host's X.509 material; see the standalone setup in
# doc §15.1.
# ---------------------------------------------------------------------------
[[transports]]
type = "unix"
socket = "%t/sudo-auth-proxy/server.sock"

[transports.security]
transport_encryption = "mtls"
client_auth = "transport"
server_auth = "transport"

[transports.mtls]
enable = true
ca_file = "./ca.crt"
cert_file = "./server.crt"
key_file = "./server.key"
required_oid = "1.3.6.1.4.1.99999.1.1"      # this (server) certificate
peer_required_oid = "1.3.6.1.4.1.99999.1.2" # the peer (client) certificate

[transports.acl]
mode = "ca"
ca_file = "./ca.crt"
required_oid = "1.3.6.1.4.1.99999.1.2"

# Approval rules refine the decision once the ACL has authorized the credential.
# The first matching rule wins; no match means `ask`.
[[transports.acl.rule]]
identity = "*"
policy = "ask"
