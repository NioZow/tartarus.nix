# clipboard-bridge — standalone server configuration (no Nix required)
#
# This is the *host* side of the service: the process that owns the clipboard
# store, serves the guests that push/pull into their own slot, and exposes every
# connected guest to a local admin CLI. It can run on any machine with Python
# 3.11+ and the `cryptography` wheel; copy it to
# `~/.config/clipboard-bridge/server.toml` and run (serve selects that file
# automatically):
#
#   clipboard-bridge serve
#
# The source of truth for the model is `docs/technical/clipboard-bridge.md`.
#
# ONE server process binds EVERY entry in `[[listeners]]`. A listener is one
# socket plus its transport, its own `[listeners.security]`, its own optional
# `[listeners.mtls]` and its own identity `resolution`; nothing is inherited
# from the document. This example binds three listeners in the one process:
#
#   * `vsock` "tartarus-vsock"  a Linux MicroVM dials the host over AF_VSOCK.
#                               Private by construction, so no crypto and no
#                               peer authentication.
#   * `tcp`   "tartarus-tcp"    a container (or a stand-in VM) dials an
#                               address:port across the shared container
#                               bridge, so this one is mTLS with the guest
#                               certificate.
#   * `unix`  "admin"           the host CLI's control plane: a same-user Unix
#                               socket, authorized by the filesystem/UID
#                               boundary plus the allow rule below.
#
# THERE IS NO SHARED SECRET. The old `secret`/`secret_file` model, the
# generated secret and the clipboard agenix secret are gone: a peer is
# authenticated by mTLS, by a private-by-construction transport, or by the
# same-user Unix boundary, and authorization is the ordered `[[rule]]` list.
# A flat server document (`transport`/`host`/`port` at the top level, or
# `admin_socket`) is rejected by name at load time.
#
# ---------------------------------------------------------------------------
# Read this before editing: the file is validated against an EXACT schema
#
# At every level, every key is checked against the set the service reads. An
# unknown key (a typo, or a key on the wrong side of a `[table]` header) is
# refused with the key named -- nothing is silently ignored. In particular TOML
# assigns a key to the **nearest preceding `[table]` header**, so
# `[listeners.security]` belongs to the listener declared just above it, and
# the three authentication knobs must be written under it. A plaintext listener
# (`transport_encryption = "none"`) must state `client_auth` and `server_auth`
# as `"none"` explicitly: authentication is never disabled implicitly.
#
# Paths inside `[listeners.mtls]` / `[mtls]` are resolved relative to this
# file's own directory, so `./ca.crt` means "next to this config"; `%t` expands
# to the per-user runtime directory.
# ---------------------------------------------------------------------------

mode = "server"

# Log connection/handshake/request timing to stderr.
debug = false

# ===========================================================================
# Guest identity maps for `resolution = "tartarus"`.
#
# A VSOCK peer is named by its CID, a TCP peer by its source IP. These are the
# maps the `tartarus` resolution reads; the name becomes `match.machine` in the
# rules. A unix-only server can omit both tables.
# ===========================================================================
[[vm]]
cid = 7
name = "dev"

[[tcp_vm]]
ip = "10.201.0.10"
name = "notes"

# ===========================================================================
# LISTENER 1 — the VSOCK guest callback, named "tartarus-vsock".
#
# AF_VSOCK is a point-to-point link between the guest and its hypervisor with
# no path for a third party, so this listener leaves crypto and authentication
# explicitly off. `security = none` is a decision that is only valid on a
# transport private by construction; switch it to mTLS if another party can
# reach the endpoint.
# ===========================================================================
[[listeners]]
# Required: the transport this listener binds ("vsock" | "tcp" | "unix").
type = "vsock"
# Optional label, unique across the server; `match.listeners` selects on it.
name = "tartarus-vsock"
# VSOCK CID to bind: 2 is VMADDR_CID_HOST (the hypervisor, from the guest side).
cid = 2
# Port both sides agree on.
port = 27795
# How a connecting peer is named for `match.machine`:
#   "none" | "certificate" | "tartarus" | "mofos".
# `tartarus` names a VSOCK peer by CID ([[vm]]) and a TCP peer by IP ([[tcp_vm]]).
resolution = "tartarus"

# All three knobs of a plaintext listener, written out on purpose.
[listeners.security]
transport_encryption = "none"
client_auth = "none"
server_auth = "none"

# ===========================================================================
# LISTENER 2 — the TCP guest callback, named "tartarus-tcp".
#
# A container dials the bridge address its host listens on. That bridge is
# shared, so unlike VSOCK this callback is *not* trusted by construction: it is
# mTLS, and the peer certificate must chain to `ca_file` AND carry the guest
# client EKU. `transport_encryption = "mtls"` forces both auth knobs to
# `"transport"`; writing anything else here is a load error, and mTLS never
# falls back to plaintext.
# ===========================================================================
[[listeners]]
type = "tcp"
name = "tartarus-tcp"
# The address the requesting containers actually reach (the container bridge
# gateway, not the VM bridge).
host = "10.201.0.1"
port = 27795
resolution = "tartarus"

[listeners.security]
transport_encryption = "mtls"
client_auth = "transport"
server_auth = "transport"

# [listeners.mtls] — required whenever a listener resolves to mTLS.
#   required_oid       the EKU this (server) certificate must carry
#   peer_required_oid  the EKU the peer (guest client) certificate must carry
# The OIDs separate roles, not services: a chain-valid certificate with the
# wrong EKU is rejected before any rule runs.
#
# NO-CA VARIANT: `ca_file` may instead be the concatenation of the CLIENT's
# self-signed certificate(s). Mint them with `tartarus-certs selfsigned --role
# server|client --service clipboard-bridge` (and `--service clipboard-admin` for
# an admin cert). The Nix option is `pubkey = { certFile; keyFile;
# trustedPeerCerts; }`, which emits this same table with `ca_file` pointing at
# the peer certificate(s), not a CA. Standard serverAuth/clientAuth EKUs are
# required (see doc §4.2a).
[listeners.mtls]
enable = true
ca_file = "./ca.crt"
cert_file = "./server.crt"
key_file = "./server.key"
required_oid = "1.3.6.1.4.1.99999.3.1"       # clipboard-bridge server
peer_required_oid = "1.3.6.1.4.1.99999.3.2"  # guest client

# ===========================================================================
# LISTENER 3 — the local admin listener, named "admin".
#
# `admin = true` makes this a control-plane listener: it accepts `clients`,
# targeted `get`/`set` and `get --json`, rejects `register`/`subscribe`, and
# runs every request through the `[[rule]]` engine. It is a normal listener --
# there is no separate `admin_socket` option.
#
# It is a same-user Unix socket: the parent directory is 0700 and the socket is
# 0600, so only processes running as the server's user can connect. That is the
# authentication model here (it is not a network credential), and any such
# process can already read/write the user's clipboard. `resolution = "none"`
# because there is no CID/IP to map; `tartarus`/`mofos` are rejected on unix.
# No certificate is needed -- certificate-auth admin is the optional variant
# (an mTLS listener with the admin peer OID .3.3).
# ===========================================================================
[[listeners]]
type = "unix"
name = "admin"
socket = "%t/clipboard-bridge-admin.sock"
admin = true
resolution = "none"
socket_dir_mode = "0700"
socket_mode = "0600"

[listeners.security]
transport_encryption = "none"
client_auth = "none"
server_auth = "none"

# ===========================================================================
# [[rule]] — the ordered authorization policy for admin requests.
#
# First match wins and there is no merging; a request matching no rule is
# denied (fail-closed). `policy` is `allow` or `deny` -- there is no `ask`
# because clipboard has no approval dialog. Selectors are `fnmatch` patterns:
# `match.listeners`, `match.machine`, `match.action`, `match.target`; an
# omitted selector matches everything.
#
# The local admin socket is same-user IPC, so it allows every admin action.
# Guest listeners serve only the guest actions and need no rule.
# ===========================================================================
[[rule]]
match.listeners = ["admin"]
policy = "allow"
